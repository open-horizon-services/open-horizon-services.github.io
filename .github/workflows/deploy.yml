name: Build and Deploy Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Least-privilege permissions: write to this repo's contents (gh-pages push)
# and read access to public org repos is handled via ORG_READ_TOKEN secret.
permissions:
  contents: write
  pages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Stage org repo docs and generate mkdocs_build.yml
        env:
          ORG_READ_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
        run: python scripts/build_nav.py

      - name: Build MkDocs site
        run: mkdocs build -f mkdocs_build.yml

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          commit_message: "docs: deploy ${{ github.sha }}"
