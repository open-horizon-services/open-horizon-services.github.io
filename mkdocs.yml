site_name: Open Horizon Services Documentation
site_url: https://open-horizon-services.github.io
site_description: >-
  Unified documentation portal for the Open Horizon Services organization.
  Aggregates docs from all service, utility, skills, and web repositories.
site_author: Open Horizon Services

docs_dir: docs

theme:
  name: material
  custom_dir: overrides
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  logo: assets/logo.svg
  favicon: assets/logo.svg

extra_css:
  - assets/extra.css

plugins:
  - search
  - monorepo

# Suppress warnings for broken relative links inside staged third-party repo
# content — those docs may reference files that weren't pulled into the staging
# directory (e.g. api/ trees, hidden .agent/ directories).  Keeping these at
# 'info' prevents --strict builds from failing on content we don't control.
validation:
  links:
    not_found: info
    unrecognized_links: info

# Prefix groups used by scripts/build_nav.py to discover org repos.
# Add or remove prefixes here without changing any scripts.
extra:
  repo_prefixes:
    - service-
    - utility-
    - skills-
    - web-

repo_url: https://github.com/open-horizon-services/open-horizon-services.github.io
repo_name: open-horizon-services/open-horizon-services.github.io
